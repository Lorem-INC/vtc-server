<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Drivers</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="icon" href="images/KL_Logo.png">
    
</head>
<body>
    <!-- Admin Control Panel -->
<div class="card p-6 mt-6">
  <h2 class="font-headline text-xl font-bold mb-4">Driver Control</h2>

  <input
    id="driverName"
    type="text"
    placeholder="Driver Name"
    class="input w-full mb-3"
  />

  <input
    id="driverKm"
    type="number"
    placeholder="KM Driven"
    class="input w-full mb-3"
  />

  <input
    id="driverPenalty"
    type="number"
    placeholder="Penalties"
    class="input w-full mb-3"
  />

  <button id="saveDriverBtn" class="btn btn-primary w-full">
    Save / Update Driver
  </button>
</div>
<script src="js/ui.js"></script>
</body>
</html>
